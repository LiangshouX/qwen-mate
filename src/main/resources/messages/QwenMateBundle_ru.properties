# QwenMateToolWindow
toolwindow.preparingBridge=Подготовка AI Bridge...
toolwindow.jcefNotInstalled=Модуль JCEF не установлен в текущей IDE
toolwindow.jcefNotInstalledSolution=Решение:\nДважды нажмите Shift, найдите "Choose Boot Java Runtime for the IDE"\nВ выпадающем списке выберите версию с пометкой "JCEF" для загрузки и установки.\nДождитесь загрузки, нажмите OK и перезапустите IDE.
toolwindow.jcefDisabled=JCEF отключен в реестре IDE
toolwindow.jcefDisabledSolution=Среда JCEF доступна, но ide.browser.jcef.enabled имеет значение false.\nНажмите «Включить JCEF», затем полностью перезапустите IDE.
toolwindow.jcefEnableAction=Включить JCEF
toolwindow.jcefRestartRequired=JCEF включен — требуется перезапуск
toolwindow.jcefRestartRequiredSolution=Реестр IDE успешно обновлен.\nПолностью закройте и перезапустите IDE для инициализации JCEF.
toolwindow.jcefPluginMissing=Для Android Studio требуется Web Browser (JCEF)
toolwindow.jcefPluginMissingSolution=Откройте Settings > Plugins > Marketplace.\nУстановите «Web Browser (JCEF)» от JetBrains и перезапустите Android Studio.\nОдной смены Boot Runtime недостаточно для установки этого модуля IDE.
toolwindow.jcefOutdatedJbr=Встроенная в IDE Java Runtime (JBR) слишком старая для JCEF
toolwindow.jcefOutdatedJbrSolution=Эта IDE (например, Android Studio 2026.x) поставляется с JBR без JCEF API,\nтребуемого платформой (JCefAppConfig.isRemoteEnabled).\nРешение:\nДважды нажмите Shift, найдите "Choose Boot Java Runtime for the IDE"\nВыберите или добавьте JetBrains Runtime с JCEF b1373 или новее.\nЗагрузка вручную: https://cache-redirector.jetbrains.com/intellij-jbr/\n(например, jbr_jcef-21.0.10-windows-x64-b1373.tar.gz)\nЗатем перезапустите IDE.
toolwindow.jcefRemoteError=Ошибка модуля JCEF в редакторе
toolwindow.jcefRemoteSolution=Известный баг JCEF (JBR-9234) в out-of-process режиме JCEF на IntelliJ 2025.2+.\nНажмите кнопку ниже, чтобы применить исправление, затем полностью перезапустите IDE (нужно именно полностью выйти, а не вернуться на страницу выбора проекта).\nРучной вариант: в Help - Edit Custom VM Options добавьте:\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=Отключить out-of-process JCEF
toolwindow.jcefOutOfProcessDisabled=Out-of-process JCEF отключён - требуется перезапуск
toolwindow.jcefOutOfProcessDisabledSolution=Реестр IDE успешно обновлён.\nПолностью закройте и перезапустите IDE, чтобы JCEF работал внутри процесса.
toolwindow.jcefRemoteActionFailedTitle=Не удалось обновить реестр IDE
toolwindow.jcefRemoteActionFailed=Не удалось автоматически записать значение реестра.\nПримените исправление вручную: в Help - Edit Custom VM Options добавьте:\n-Dide.browser.jcef.out-of-process.enabled=false\nЗатем полностью перезапустите IDE.
toolwindow.extractingTitle=Подготовка AI Bridge...
toolwindow.extractingDesc=Первоначальная настройка: извлечение компонентов AI Bridge.\nЭто происходит только при первой установке/обновлении (прибл. 10-30 сек).

