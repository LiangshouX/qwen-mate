# QwenMateToolWindow
toolwindow.preparingBridge=AI Bridge を準備中...
toolwindow.jcefNotInstalled=現在の IDE に JCEF モジュールがインストールされていません
toolwindow.jcefNotInstalledSolution=解決方法:\nShift を2回押して、"Choose Boot Java Runtime for the IDE" を検索\nドロップダウンから "JCEF" マーク付きのバージョンを選択してダウンロード・インストール。\nダウンロード完了後、OK をクリックして IDE を再起動してください。
toolwindow.jcefDisabled=IDE レジストリで JCEF が無効になっています
toolwindow.jcefDisabledSolution=JCEF ランタイムは利用可能ですが、ide.browser.jcef.enabled が false です。\n「JCEF を有効化」をクリックし、IDE を完全に再起動してください。
toolwindow.jcefEnableAction=JCEF を有効化
toolwindow.jcefRestartRequired=JCEF を有効化しました - 再起動が必要です
toolwindow.jcefRestartRequiredSolution=IDE レジストリを更新しました。\nJCEF を初期化するため、IDE を完全に終了して再起動してください。
toolwindow.jcefPluginMissing=Android Studio には Web Browser (JCEF) が必要です
toolwindow.jcefPluginMissingSolution=Settings > Plugins > Marketplace を開きます。\nJetBrains の「Web Browser (JCEF)」をインストールし、Android Studio を再起動してください。\nBoot Runtime の変更だけでは、この IDE モジュールはインストールされません。
toolwindow.jcefOutdatedJbr=IDE 同梱の Java ランタイム（JBR）が古く、JCEF を起動できません
toolwindow.jcefOutdatedJbrSolution=この IDE（例: Android Studio 2026.x）に同梱の JBR には、プラットフォームが必要とする\nJCEF API（JCefAppConfig.isRemoteEnabled）がありません。\n解決方法:\nShift を2回押して、"Choose Boot Java Runtime for the IDE" を検索\nJCEF b1373 以降の JetBrains Runtime を選択または追加してください。\n手動ダウンロード: https://cache-redirector.jetbrains.com/intellij-jbr/\n（例: jbr_jcef-21.0.10-windows-x64-b1373.tar.gz）\nその後 IDE を再起動してください。
toolwindow.jcefRemoteError=エディターで JCEF モジュールエラーが発生しました
toolwindow.jcefRemoteSolution=IntelliJ 2025.2+ の out-of-process JCEF モードにおける既知の JCEF 不具合 (JBR-9234) です。\n下のボタンをクリックして修正を適用し、IDE を完全に再起動してください（プロジェクト選択画面に戻るだけではなく、完全に終了する必要があります）。\n手動の代替案：Help - Edit Custom VM Options に以下を追加：\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=out-of-process JCEF を無効化
toolwindow.jcefOutOfProcessDisabled=out-of-process JCEF を無効化しました - 再起動が必要です
toolwindow.jcefOutOfProcessDisabledSolution=IDE Registry は正常に更新されました。\nIDE を完全に終了して再起動すると、JCEF がインプロセスで実行されます。
toolwindow.jcefRemoteActionFailedTitle=IDE Registry を更新できませんでした
toolwindow.jcefRemoteActionFailed=Registry 値を自動で書き込めませんでした。\n手動で修正を適用してください：Help - Edit Custom VM Options に以下を追加：\n-Dide.browser.jcef.out-of-process.enabled=false\nその後、IDE を完全に再起動してください。
toolwindow.extractingTitle=AI Bridge を準備中...
toolwindow.extractingDesc=初回セットアップ：AI Bridge コンポーネントを展開中。\nこの処理は初回インストール/更新時のみ発生します（約 10-30 秒）。

