# QwenMateToolWindow
toolwindow.preparingBridge=Preparing AI Bridge...
toolwindow.jcefNotInstalled=JCEF module not installed in current IDE
toolwindow.jcefNotInstalledSolution=Solution:\nDouble-click Shift, search for "Choose Boot Java Runtime for the IDE"\nIn the dropdown, select a version marked with "JCEF" to download and install.\nWait for download to complete, click OK, then restart the IDE.
toolwindow.jcefDisabled=JCEF is disabled in the IDE Registry
toolwindow.jcefDisabledSolution=The JCEF runtime is available, but ide.browser.jcef.enabled is false.\nClick "Enable JCEF", then fully restart the IDE.
toolwindow.jcefEnableAction=Enable JCEF
toolwindow.jcefRestartRequired=JCEF enabled - restart required
toolwindow.jcefRestartRequiredSolution=The IDE Registry has been updated successfully.\nFully exit and restart the IDE to initialize JCEF.
toolwindow.jcefPluginMissing=Web Browser (JCEF) is required in Android Studio
toolwindow.jcefPluginMissingSolution=Open Settings > Plugins > Marketplace.\nInstall "Web Browser (JCEF)" by JetBrains, then restart Android Studio.\nChanging the Boot Runtime alone does not install this IDE module.
toolwindow.jcefOutdatedJbr=IDE's bundled Java Runtime (JBR) is too old for JCEF
toolwindow.jcefOutdatedJbrSolution=This IDE (e.g. Android Studio 2026.x) ships a JBR that lacks the JCEF API\nrequired by the platform (JCefAppConfig.isRemoteEnabled).\nSolution:\nDouble-click Shift, search for "Choose Boot Java Runtime for the IDE"\nSelect or add a JetBrains Runtime with JCEF b1373 or newer.\nManual download: https://cache-redirector.jetbrains.com/intellij-jbr/\n(e.g. jbr_jcef-21.0.10-windows-x64-b1373.tar.gz)\nThen restart the IDE.
toolwindow.jcefRemoteError=JCEF module error in editor
toolwindow.jcefRemoteSolution=Known JCEF bug (JBR-9234) in IntelliJ's out-of-process JCEF mode on 2025.2+.\nUse the button below to apply the fix, then fully restart the IDE (you must exit completely, not just return to the project selection page).\nManual alternative: in Help - Edit Custom VM Options add:\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=Disable out-of-process JCEF
toolwindow.jcefOutOfProcessDisabled=Out-of-process JCEF disabled - restart required
toolwindow.jcefOutOfProcessDisabledSolution=The IDE Registry has been updated successfully.\nFully exit and restart the IDE to run JCEF in-process.
toolwindow.jcefRemoteActionFailedTitle=Could not update IDE Registry
toolwindow.jcefRemoteActionFailed=The registry value could not be written automatically.\nApply the fix manually: in Help - Edit Custom VM Options add:\n-Dide.browser.jcef.out-of-process.enabled=false\nThen fully restart the IDE.
toolwindow.extractingTitle=Preparing AI Bridge...
toolwindow.extractingDesc=First-time setup: extracting AI Bridge components.\nThis only happens on first install/update (approx. 10-30s).

