# QwenMateToolWindow
toolwindow.preparingBridge=正在準備 AI Bridge...
toolwindow.jcefNotInstalled=當前 IDE 未安裝 JCEF 模組
toolwindow.jcefNotInstalledSolution=解決方案:\n雙擊 Shift，搜尋 "Choose Boot Java Runtime for the IDE"\n在下拉選單中選擇標記有 "JCEF" 的版本進行下載安裝。\n等待下載完成，點擊確定，然後重新啟動 IDE。
toolwindow.jcefDisabled=IDE Registry 已停用 JCEF
toolwindow.jcefDisabledSolution=JCEF 執行階段已可用，但 ide.browser.jcef.enabled 為 false。\n點擊「啟用 JCEF」，然後完全退出並重新啟動 IDE。
toolwindow.jcefEnableAction=啟用 JCEF
toolwindow.jcefRestartRequired=JCEF 已啟用，需要重新啟動
toolwindow.jcefRestartRequiredSolution=IDE Registry 已成功更新。\n請完全退出並重新啟動 IDE，以初始化 JCEF。
toolwindow.jcefPluginMissing=Android Studio 需要 Web Browser (JCEF)
toolwindow.jcefPluginMissingSolution=開啟 Settings > Plugins > Marketplace。\n安裝 JetBrains 發布的「Web Browser (JCEF)」，然後重新啟動 Android Studio。\n僅更換 Boot Runtime 不會安裝該 IDE 模組。
toolwindow.jcefOutdatedJbr=IDE 內建的 Java 執行階段（JBR）過舊，無法啟動 JCEF
toolwindow.jcefOutdatedJbrSolution=當前 IDE（如 Android Studio 2026.x）內建的 JBR 缺少平台所需的 JCEF API\n（JCefAppConfig.isRemoteEnabled）。\n解決方案:\n雙擊 Shift，搜尋 "Choose Boot Java Runtime for the IDE"\n選擇或新增 JCEF b1373 及更新版本的 JetBrains Runtime。\n手動下載: https://cache-redirector.jetbrains.com/intellij-jbr/\n（例如 jbr_jcef-21.0.10-windows-x64-b1373.tar.gz）\n完成後重新啟動 IDE。
toolwindow.jcefRemoteError=編輯器中 JCEF 模組出錯
toolwindow.jcefRemoteSolution=這是 IntelliJ 2025.2+ 的 out-of-process JCEF 模式中已知的 JCEF 缺陷 (JBR-9234)。\n點擊下方按鈕套用修復，然後完全重新啟動 IDE（必須完全退出，不能只是返回到專案選擇頁面）。\n手動替代方案：在 Help - Edit Custom VM Options 中新增：\n-Dide.browser.jcef.out-of-process.enabled=false
toolwindow.jcefRemoteAction=停用 out-of-process JCEF
toolwindow.jcefOutOfProcessDisabled=已停用 out-of-process JCEF，需要重新啟動
toolwindow.jcefOutOfProcessDisabledSolution=IDE Registry 已成功更新。\n請完全退出並重新啟動 IDE，使 JCEF 以同處理程序模式執行。
toolwindow.jcefRemoteActionFailedTitle=無法更新 IDE Registry
toolwindow.jcefRemoteActionFailed=無法自動寫入 Registry 值。\n請手動套用修復：在 Help - Edit Custom VM Options 中新增：\n-Dide.browser.jcef.out-of-process.enabled=false\n然後完全重新啟動 IDE。
toolwindow.extractingTitle=正在準備 AI Bridge...
toolwindow.extractingDesc=首次設定：正在提取 AI Bridge 元件。\n此過程僅在首次安裝/更新時發生（約 10-30 秒）。

